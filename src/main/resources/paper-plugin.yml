name: ChatSentry
version: ${version}
main: io.github.driftn2forty.chatsentry.ChatSentry
description: Multi-layered chat moderation — trie filter, moderation API, and LLM review
api-version: "1.21"
author: DriftN2Forty
website: https://github.com/DriftN2Forty/ChatSentry

commands:
  chatsentry:
    description: ChatSentry admin commands
    usage: "/chatsentry <reload|status|history|purge>"
    permission: chatsentry.staff

dependencies:
  server:
    PlaceholderAPI:
      required: false
      load: BEFORE

permissions:
  chatsentry.bypass:
    description: Skip all moderation (chat, whispers, signs, books, anvils)
    default: false
  chatsentry.staff:
    description: Receive escalation alerts
    default: op
  chatsentry.admin:
    description: Full admin access
    default: op
