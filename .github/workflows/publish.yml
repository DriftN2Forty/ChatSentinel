name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - dev

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build test

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            CHANNEL="release"
          else
            BASE_VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts)
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${BASE_VERSION}-alpha+${SHORT_SHA}"
            CHANNEL="alpha"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        run: ./gradlew modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_CHANNEL: ${{ steps.version.outputs.channel }}

      - name: Publish to Hangar
        run: ./gradlew publishPluginPublicationToHangar
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_CHANNEL: ${{ steps.version.outputs.channel }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/ChatSentinel-*.jar
          generate_release_notes: true
